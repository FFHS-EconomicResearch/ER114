<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250"
     font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-r" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#D50006"/>
    </marker>
    <marker id="arr-p" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#502479"/>
    </marker>
    <marker id="arr-g" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#7d0a52"/>
    </marker>
  </defs>

  <!-- ===== Panel 1 — BACKDOOR ===== -->
  <g transform="translate(20,0)">
    <text x="140" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#D50006">Backdoor</text>
    <circle cx="140" cy="65" r="18" fill="#fff" stroke="#686868" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="140" y="70" font-size="17" font-style="italic" text-anchor="middle" fill="#686868">u</text>
    <circle cx="60" cy="170" r="18" fill="#fff" stroke="#D50006" stroke-width="2"/>
    <text x="60" y="175" font-size="17" font-style="italic" text-anchor="middle" fill="#D50006">x</text>
    <circle cx="220" cy="170" r="18" fill="#fff" stroke="#D50006" stroke-width="2"/>
    <text x="220" y="175" font-size="17" font-style="italic" text-anchor="middle" fill="#D50006">y</text>
    <line x1="126" y1="78" x2="74" y2="155" stroke="#686868" stroke-width="1.8" marker-end="url(#arr-r)"/>
    <line x1="154" y1="78" x2="206" y2="155" stroke="#686868" stroke-width="1.8" marker-end="url(#arr-r)"/>
    <line x1="80" y1="170" x2="200" y2="170" stroke="#D50006" stroke-width="2" marker-end="url(#arr-r)"/>
    <text x="140" y="218" font-size="10.5" text-anchor="middle" fill="#686868">x &#x2190; u &#x2192; y opens a spurious path</text>
    <text x="140" y="234" font-size="10.5" text-anchor="middle" fill="#686868"><tspan font-style="italic">block</tspan> by conditioning on u (or IV)</text>
  </g>

  <!-- ===== Panel 2 — FRONTDOOR ===== -->
  <g transform="translate(310,0)">
    <text x="140" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#502479">Frontdoor</text>
    <circle cx="60" cy="55" r="18" fill="#fff" stroke="#686868" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="60" y="60" font-size="17" font-style="italic" text-anchor="middle" fill="#686868">u</text>
    <circle cx="60" cy="170" r="18" fill="#fff" stroke="#502479" stroke-width="2"/>
    <text x="60" y="175" font-size="17" font-style="italic" text-anchor="middle" fill="#502479">x</text>
    <circle cx="140" cy="170" r="18" fill="#fff" stroke="#502479" stroke-width="2"/>
    <text x="140" y="175" font-size="17" font-style="italic" text-anchor="middle" fill="#502479">m</text>
    <circle cx="220" cy="170" r="18" fill="#fff" stroke="#502479" stroke-width="2"/>
    <text x="220" y="175" font-size="17" font-style="italic" text-anchor="middle" fill="#502479">y</text>
    <line x1="60" y1="73" x2="60" y2="152" stroke="#686868" stroke-width="1.8" marker-end="url(#arr-p)"/>
    <path d="M 75 60 Q 200 30 220 152" fill="none" stroke="#686868" stroke-width="1.8" stroke-dasharray="3,3" marker-end="url(#arr-p)"/>
    <line x1="80" y1="170" x2="120" y2="170" stroke="#502479" stroke-width="2" marker-end="url(#arr-p)"/>
    <line x1="160" y1="170" x2="200" y2="170" stroke="#502479" stroke-width="2" marker-end="url(#arr-p)"/>
    <text x="140" y="218" font-size="10.5" text-anchor="middle" fill="#686868">mediator m identifies the effect</text>
    <text x="140" y="234" font-size="10.5" text-anchor="middle" fill="#686868"><tspan font-style="italic">even if</tspan> u confounds x and y</text>
  </g>

  <!-- ===== Panel 3 — COLLIDER ===== -->
  <g transform="translate(610,0)">
    <text x="140" y="22" font-size="14" font-weight="bold" text-anchor="middle" fill="#7d0a52">Collider</text>
    <circle cx="60" cy="65" r="18" fill="#fff" stroke="#7d0a52" stroke-width="2"/>
    <text x="60" y="70" font-size="17" font-style="italic" text-anchor="middle" fill="#7d0a52">x</text>
    <circle cx="220" cy="65" r="18" fill="#fff" stroke="#7d0a52" stroke-width="2"/>
    <text x="220" y="70" font-size="17" font-style="italic" text-anchor="middle" fill="#7d0a52">y</text>
    <circle cx="140" cy="170" r="18" fill="#fff" stroke="#7d0a52" stroke-width="2"/>
    <text x="140" y="175" font-size="17" font-style="italic" text-anchor="middle" fill="#7d0a52">c</text>
    <line x1="74" y1="78" x2="126" y2="155" stroke="#7d0a52" stroke-width="2" marker-end="url(#arr-g)"/>
    <line x1="206" y1="78" x2="154" y2="155" stroke="#7d0a52" stroke-width="2" marker-end="url(#arr-g)"/>
    <rect x="35" y="190" width="210" height="22" fill="#fdf5fa" stroke="#7d0a52" stroke-width="1" rx="4"/>
    <text x="140" y="206" font-size="10.5" text-anchor="middle" fill="#7d0a52" font-weight="bold">do NOT condition on c</text>
    <text x="140" y="234" font-size="10.5" text-anchor="middle" fill="#686868">conditioning <tspan font-style="italic">opens</tspan> spurious x&#x2013;y path</text>
  </g>
</svg>
