<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Helvetica, Arial, sans-serif">

  <!-- ===========================================
       Colour palette (FFHS / Lab):
         primary    #D50006   (red,    Path E1)
         secondary  #502479   (purple, Path E2)
         neutral    #686868   (grey,   Path P)
         dark       #2c2c2c   (text)
         light_bg   #f4f0fa   (boxes)
         link       #686868   (arrows)
       =========================================== -->

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#686868"/>
    </marker>
  </defs>

  <!-- =====================  TITLE  ===================== -->
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="600" fill="#2c2c2c">
    Three paths to the data-generating process
  </text>
  <text x="450" y="60" text-anchor="middle" font-size="13" fill="#686868">
    Same DGP — different questions, different methods
  </text>

  <!-- =====================  DGP BOX  ===================== -->
  <rect x="320" y="100" width="260" height="105" rx="12" ry="12"
        fill="#f4f0fa" stroke="#502479" stroke-width="2.5"/>
  <text x="450" y="132" text-anchor="middle" font-size="17" font-weight="700" fill="#2c2c2c">
    Data-generating process
  </text>
  <text x="450" y="156" text-anchor="middle" font-size="13" fill="#2c2c2c">
    the true mechanism behind the data
  </text>
  <text x="450" y="180" text-anchor="middle" font-size="12" fill="#686868" font-style="italic">
    we observe samples, not the process itself
  </text>

  <!-- =====================  ARROWS DOWN  ===================== -->
  <line x1="160" y1="220" x2="160" y2="280"
        stroke="#686868" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="205" x2="450" y2="280"
        stroke="#686868" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="220" x2="740" y2="280"
        stroke="#686868" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- horizontal line for tree look  -->
  <line x1="450" y1="220" x2="160" y2="220"
        stroke="#686868" stroke-width="2"/>
  <line x1="450" y1="220" x2="740" y2="220"
        stroke="#686868" stroke-width="2"/>

  <!-- =====================  PATH E1  ===================== -->
  <rect x="40" y="285" width="240" height="170" rx="10" ry="10"
        fill="#ffffff" stroke="#D50006" stroke-width="2.5"/>
  <text x="160" y="312" text-anchor="middle" font-size="16" font-weight="700" fill="#D50006">
    Path E1 — Explain
  </text>
  <text x="160" y="332" text-anchor="middle" font-size="12" fill="#686868">
    under assumed exogeneity
  </text>
  <line x1="60" y1="345" x2="260" y2="345" stroke="#D50006" stroke-width="0.8" opacity="0.4"/>
  <text x="160" y="368" text-anchor="middle" font-size="13" font-weight="600" fill="#2c2c2c">
    Estimate structural &#946;
  </text>
  <text x="160" y="388" text-anchor="middle" font-size="12" fill="#2c2c2c">
    OLS &#8212; BLUE conditions
  </text>
  <text x="160" y="406" text-anchor="middle" font-size="12" fill="#2c2c2c">
    Diagnostics, robust SE
  </text>
  <text x="160" y="436" text-anchor="middle" font-size="11" fill="#686868" font-style="italic">
    Lab 1 Step 1
  </text>

  <!-- =====================  PATH E2  ===================== -->
  <rect x="330" y="285" width="240" height="170" rx="10" ry="10"
        fill="#ffffff" stroke="#502479" stroke-width="2.5"/>
  <text x="450" y="312" text-anchor="middle" font-size="16" font-weight="700" fill="#502479">
    Path E2 — Explain
  </text>
  <text x="450" y="332" text-anchor="middle" font-size="12" fill="#686868">
    via study design
  </text>
  <line x1="350" y1="345" x2="550" y2="345" stroke="#502479" stroke-width="0.8" opacity="0.4"/>
  <text x="450" y="368" text-anchor="middle" font-size="13" font-weight="600" fill="#2c2c2c">
    Identify causal &#946;
  </text>
  <text x="450" y="388" text-anchor="middle" font-size="12" fill="#2c2c2c">
    RCT, DiD, IV
  </text>
  <text x="450" y="406" text-anchor="middle" font-size="12" fill="#2c2c2c">
    Intervention in the DGP
  </text>
  <text x="450" y="436" text-anchor="middle" font-size="11" fill="#686868" font-style="italic">
    Lab 3
  </text>

  <!-- =====================  PATH P  ===================== -->
  <rect x="620" y="285" width="240" height="170" rx="10" ry="10"
        fill="#ffffff" stroke="#686868" stroke-width="2.5"/>
  <text x="740" y="312" text-anchor="middle" font-size="16" font-weight="700" fill="#686868">
    Path P — Predict
  </text>
  <text x="740" y="332" text-anchor="middle" font-size="12" fill="#686868">
    under stable relationships
  </text>
  <line x1="640" y1="345" x2="840" y2="345" stroke="#686868" stroke-width="0.8" opacity="0.4"/>
  <text x="740" y="368" text-anchor="middle" font-size="13" font-weight="600" fill="#2c2c2c">
    Replicate DGP output
  </text>
  <text x="740" y="388" text-anchor="middle" font-size="12" fill="#2c2c2c">
    OOS-evaluation, CV
  </text>
  <text x="740" y="406" text-anchor="middle" font-size="12" fill="#2c2c2c">
    Lasso, Ridge, regularisation
  </text>
  <text x="740" y="436" text-anchor="middle" font-size="11" fill="#686868" font-style="italic">
    Lab 1 Step 3 &#8226; Lab 2
  </text>

  <!-- =====================  FOOTER  ===================== -->
  <text x="450" y="500" text-anchor="middle" font-size="11" fill="#686868">
    Shmueli (2010) &#8212; To Explain or to Predict?  &#8226;  Breiman (2001) &#8212; Two Cultures  &#8226;  Mullainathan &amp; Spiess (2017) &#8212; ML Econometrics
  </text>
</svg>
