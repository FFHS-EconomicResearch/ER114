<svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg"
     font-family="'Source Sans Pro', 'Helvetica Neue', sans-serif">
  <defs>
    <style>
      .head    { font-size:20px; font-weight:bold; }
      .sub     { font-size:13px; font-style:italic; fill:#686868; }
      .box-lab { font-size:12px; font-weight:bold; fill:#fff; text-anchor:middle; }
      .anno    { font-size:12px; fill:#2c2c2c; text-anchor:middle; }
      .anno-it { font-size:11px; fill:#686868; font-style:italic; text-anchor:middle; }
      .role    { font-size:11px; font-weight:bold; text-anchor:middle; }
      .path    { font-size:11px; font-weight:bold; text-anchor:middle; fill:#fff; }
    </style>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#686868"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D50006"/>
    </marker>
    <marker id="arr-purple" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#502479"/>
    </marker>
  </defs>

  <!-- ============================================== -->
  <!-- TOP: Induction (purple)                        -->
  <!-- ============================================== -->
  <text class="head" x="500" y="35" text-anchor="middle" fill="#502479">
    Induction — learning from data
  </text>
  <text class="sub" x="500" y="55" text-anchor="middle">
    Specific observations → general rule
  </text>

  <!-- Data box (left) -->
  <rect x="60" y="80" width="170" height="80" rx="8"
        fill="#f5f0fa" stroke="#502479" stroke-width="2"/>
  <text class="role" x="145" y="105" fill="#502479">DATA</text>
  <text class="anno" x="145" y="125">many observations</text>
  <text class="anno-it" x="145" y="143">(x₁,y₁), (x₂,y₂), …</text>

  <!-- Arrow (purple) -->
  <line x1="240" y1="120" x2="400" y2="120"
        stroke="#502479" stroke-width="2.5" marker-end="url(#arr-purple)"/>
  <text class="anno" x="320" y="110">fit / train / mine</text>

  <!-- Model box (right) -->
  <rect x="410" y="80" width="180" height="80" rx="8"
        fill="#502479" stroke="#502479" stroke-width="2"/>
  <text class="path" x="500" y="105">GENERAL MODEL</text>
  <text class="path" x="500" y="125" font-weight="normal" font-size="11">ŷ = f(x; β̂)</text>
  <text class="path" x="500" y="143" font-weight="normal" font-style="italic" font-size="10">a hypothesis about the world</text>

  <!-- Role of data callout (right) -->
  <rect x="640" y="80" width="300" height="80" rx="6"
        fill="#fff" stroke="#502479" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text class="role" x="790" y="100" fill="#502479">Role of data</text>
  <text class="anno" x="790" y="120">source material from which</text>
  <text class="anno" x="790" y="138">the hypothesis is generated</text>

  <!-- Examples row -->
  <text class="anno-it" x="500" y="195" fill="#686868">
    Data Science: data mining · model training · estimation
  </text>

  <!-- ============================================== -->
  <!-- DIVIDER LINE                                   -->
  <!-- ============================================== -->
  <line x1="60" y1="225" x2="940" y2="225"
        stroke="#cccccc" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ============================================== -->
  <!-- BOTTOM: Deduction (red)                        -->
  <!-- ============================================== -->
  <text class="head" x="500" y="265" text-anchor="middle" fill="#D50006">
    Deduction — applying / testing a rule
  </text>
  <text class="sub" x="500" y="285" text-anchor="middle">
    General rule + specific case → consequence
  </text>

  <!-- Model box (left) -->
  <rect x="60" y="310" width="180" height="80" rx="8"
        fill="#D50006" stroke="#D50006" stroke-width="2"/>
  <text class="path" x="150" y="335">GENERAL MODEL</text>
  <text class="path" x="150" y="355" font-weight="normal" font-size="11">y = β₀ + β₁ x + ε</text>
  <text class="path" x="150" y="373" font-weight="normal" font-style="italic" font-size="10">specified before seeing data</text>

  <!-- Arrow into "test against" -->
  <line x1="250" y1="350" x2="395" y2="350"
        stroke="#D50006" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text class="anno" x="322" y="340">test / predict</text>

  <!-- Data box (middle-right) -->
  <rect x="405" y="310" width="170" height="80" rx="8"
        fill="#fff5f5" stroke="#D50006" stroke-width="2"/>
  <text class="role" x="490" y="335" fill="#D50006">DATA</text>
  <text class="anno" x="490" y="355">used as evidence</text>
  <text class="anno-it" x="490" y="373">(reject? confirm? predict?)</text>

  <!-- Role of data callout (right) -->
  <rect x="640" y="310" width="300" height="80" rx="6"
        fill="#fff" stroke="#D50006" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text class="role" x="790" y="330" fill="#D50006">Role of data</text>
  <text class="anno" x="790" y="350">arbiter that tests an a-priori</text>
  <text class="anno" x="790" y="368">hypothesis or yields a prediction</text>

  <!-- Examples row -->
  <text class="anno-it" x="500" y="425" fill="#686868">
    Statistics: classical inference (E1, E2) · prediction on new x (P)
  </text>

  <!-- ============================================== -->
  <!-- BOTTOM PATH MAPPING                            -->
  <!-- ============================================== -->
  <rect x="60" y="445" width="880" height="46" rx="6"
        fill="#f5f5f5" stroke="#686868" stroke-width="1"/>
  <text x="125" y="463" font-size="12" fill="#2c2c2c" font-weight="bold">Path P:</text>
  <text x="175" y="463" font-size="12" fill="#2c2c2c">induction + deduction (data → model → new predictions)</text>

  <text x="125" y="482" font-size="12" fill="#2c2c2c" font-weight="bold">Path E:</text>
  <text x="180" y="482" font-size="12" fill="#2c2c2c">deduction — a-priori specification of a model equation (E1) or a research design (E2)</text>
</svg>
