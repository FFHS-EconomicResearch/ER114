<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="Helvetica, Arial, sans-serif">
  <!-- Axes -->
  <line x1="70" y1="270" x2="450" y2="270" stroke="#686868" stroke-width="1.5"/>
  <line x1="70" y1="30"  x2="70"  y2="270" stroke="#686868" stroke-width="1.5"/>
  <text x="260" y="305" font-size="12" text-anchor="middle" fill="#686868">log(λ) →</text>
  <text x="30" y="150"  font-size="12" text-anchor="middle" fill="#686868" transform="rotate(-90 30,150)">Cross-validated MSE</text>

  <!-- Error band (light gray) — schematic SE band around curve -->
  <path d="M 90 95 Q 200 200 230 220 Q 280 210 340 165 Q 400 90 440 50 L 440 90 Q 400 140 340 195 Q 280 240 230 250 Q 200 230 90 130 Z"
        fill="#e8e8e8" stroke="none"/>

  <!-- The CV curve -->
  <path d="M 90 112 Q 200 215 230 235 Q 280 225 340 180 Q 400 105 440 70" fill="none" stroke="#000" stroke-width="2.4"/>

  <!-- lambda.min marker (purple) -->
  <line x1="230" y1="235" x2="230" y2="270" stroke="#502479" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="230" cy="235" r="5" fill="#502479"/>
  <text x="230" y="289" font-size="11" text-anchor="middle" fill="#502479" font-style="italic">λ_min</text>

  <!-- lambda.1se marker (red) — at larger lambda (right of min) where curve = min + 1 SE -->
  <line x1="330" y1="190" x2="330" y2="270" stroke="#D50006" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="330" cy="190" r="5" fill="#D50006"/>
  <text x="330" y="289" font-size="11" text-anchor="middle" fill="#D50006" font-style="italic">λ_1SE</text>

  <!-- 1-SE horizontal guideline -->
  <line x1="220" y1="190" x2="340" y2="190" stroke="#D50006" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="280" y="178" font-size="9.5" text-anchor="middle" fill="#D50006">+ 1 SE</text>

  <!-- Annotations: underfit / overfit -->
  <text x="120" y="50" font-size="10.5" fill="#686868">↤ underfit</text>
  <text x="395" y="50" font-size="10.5" fill="#686868">overfit ↦</text>

  <!-- Title -->
  <text x="260" y="20" font-size="13" font-weight="bold" text-anchor="middle" fill="#686868">k-fold cross-validation curve</text>
</svg>
