<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240"
     font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#502479"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#D50006"/>
    </marker>
  </defs>

  <!-- Nodes: u top, x bottom-left, y bottom-right -->
  <circle cx="180" cy="50" r="22" fill="#fff" stroke="#686868" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="180" y="56" font-size="20" font-style="italic" text-anchor="middle" fill="#686868">u</text>

  <circle cx="70" cy="180" r="22" fill="#fff" stroke="#502479" stroke-width="2"/>
  <text x="70" y="186" font-size="20" font-style="italic" text-anchor="middle" fill="#502479">x</text>

  <circle cx="290" cy="180" r="22" fill="#fff" stroke="#502479" stroke-width="2"/>
  <text x="290" y="186" font-size="20" font-style="italic" text-anchor="middle" fill="#502479">y</text>

  <!-- u → x (backdoor leg, purple) -->
  <line x1="163" y1="65" x2="86" y2="161" stroke="#502479" stroke-width="2"
        marker-end="url(#arrow)"/>
  <!-- u → y (backdoor leg, purple) -->
  <line x1="197" y1="65" x2="274" y2="161" stroke="#502479" stroke-width="2"
        marker-end="url(#arrow)"/>

  <!-- x → y (contested causal arrow, red dashed) -->
  <line x1="95" y1="180" x2="265" y2="180" stroke="#D50006" stroke-width="2.4"
        stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
  <text x="180" y="200" font-size="11" text-anchor="middle" fill="#D50006" font-style="italic">causal? confounded?</text>

  <!-- Label u as unobserved -->
  <text x="180" y="22" font-size="10" text-anchor="middle" fill="#686868">unobserved confounder</text>
</svg>
